// 甜薯剧本杀 · 安卓壳 App（WebView 包壳）
// 只做一件事：打开 App 直接进网站。网站改了 App 就是新的，不用重新打包。
//
// 注意：文件名是 build.gradle（不是 .kts），所以这里是 **Groovy** 写法 ——
// 单引号、无等号赋值。别写成 Kotlin DSL，否则会报 "unknown property"。
plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}
