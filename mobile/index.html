<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0B0B0D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>甜薯剧本杀</title>
  <link rel="stylesheet" href="/m/styles.css?v=7">
  <script>
    window.__mobileErrors = [];
    function showErr(msg){
      window.__mobileErrors.push(msg);
      var b = document.getElementById('jsError');
      if(!b){
        b = document.createElement('div');
        b.id = 'jsError';
        b.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#0B0B0D;color:#FF6B6B;padding:20px;white-space:pre-wrap;overflow:auto;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace';
        document.body.appendChild(b);
      }
      b.textContent += msg + '\n' + ('—'.repeat(20)) + '\n';
    }
    window.onerror = function(msg, url, line, col, err){
      showErr((url||'') + ':' + (line||0) + ':' + (col||0) + ' ' + msg + '\n' + (err && err.stack || ''));
    };
    window.addEventListener('error', function(e){
      if(e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK'))
        showErr('资源加载失败: ' + (e.target.src || e.target.href || ''));
    });
  </script>
</head>
<body>
  <div id="app">
    <!-- 顶部：苹果/Stripe 式极简文字导航，无底部 Tab -->
    <header class="topbar">
      <div class="topbar__brand" id="brandName">甜薯剧本杀</div>
      <nav class="topnav" id="topnav">
        <a data-key="home">首页</a>
        <a data-key="scripts">挑本</a>
        <a data-key="car">拼车</a>
        <a data-key="group">组局</a>
        <a data-key="me">我的</a>
      </nav>
    </header>

    <main>
      <section class="view" id="view-home" data-view="home"></section>
      <section class="view" id="view-scripts" data-view="scripts"></section>
      <section class="view" id="view-car" data-view="car"></section>
      <section class="view" id="view-group" data-view="group"></section>
      <section class="view" id="view-me" data-view="me"></section>
    </main>

    <!-- 发起：右下极小胶囊（非 Tab） -->
    <button class="fab" id="fab" type="button" aria-label="发起">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>发起</span>
    </button>
  </div>

  <!-- 底部 Sheet（Airbnb/Uber：次级操作收进来） -->
  <div class="sheet-mask" id="sheetMask"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet__grip"></div>
    <div class="sheet__title" id="sheetTitle"></div>
    <div class="sheet__body" id="sheetBody"></div>
  </div>

  <!-- 全屏详情（Netflix/Spotify 画布） -->
  <div class="detail" id="detail">
    <button class="detail__back" id="detailBack" type="button" aria-label="返回">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="detail__scroll" id="detailContent"></div>
  </div>

  <script src="/m/data.js?v=7"></script>
  <script src="/m/app.js?v=7"></script>
</body>
</html>
