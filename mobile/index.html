<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#100D0C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>甜薯剧本杀</title>
  <link rel="stylesheet" href="/m/styles.css?v=6">
  <script>
    // 任何脚本/CSS 加载或运行出错，都把它全屏显示出来，避免「白屏不知道为什么」
    window.__mobileErrors = [];
    function showErr(msg){
      window.__mobileErrors.push(msg);
      var b = document.getElementById('jsError');
      if(!b){
        b = document.createElement('div');
        b.id = 'jsError';
        b.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#100D0C;color:#FF6B6B;padding:20px;white-space:pre-wrap;overflow:auto;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace';
        document.body.appendChild(b);
      }
      b.textContent += msg + '\n' + ('—'.repeat(20)) + '\n';
    }
    window.onerror = function(msg, url, line, col, err){
      showErr((url||'') + ':' + (line||0) + ':' + (col||0) + ' ' + msg + '\n' + (err && err.stack || ''));
    };
    window.addEventListener('error', function(e){
      if(e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK'))
        showErr('资源加载失败: ' + (e.target.src || e.target.href || ''));
    });
  </script>
</head>
<body>
  <div id="app">
    <!-- 顶部：毛玻璃顶导（向 Apple / Stripe 移动端网站学习：半透明 + 20px 模糊，内容透出来但文字清晰） -->
    <header class="topbar">
      <div class="topbar__row">
        <div class="brand">
          <span class="brand__mark"></span>
          <span class="brand__name" id="brandName">甜薯剧本杀</span>
        </div>
        <button class="loc" id="locBtn" type="button">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.3-7-11a7 7 0 0114 0c0 4.7-7 11-7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
          <span>上海·静安</span>
        </button>
      </div>
      <label class="searchbox">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="globalSearch" type="search" placeholder="搜本子 / 类型 / DM" inputmode="search">
      </label>
    </header>

    <main>
      <section class="view" id="view-home" data-view="home"></section>
      <section class="view" id="view-scripts" data-view="scripts"></section>
      <section class="view" id="view-car" data-view="car"></section>
      <section class="view" id="view-group" data-view="group"></section>
      <section class="view" id="view-me" data-view="me"></section>
    </main>

    <!-- 发起：右下浮动主操作（向 小红书 中央发布 / 通用 FAB 学习，但落拇指热区右下） -->
    <button class="fab" id="fab" type="button" aria-label="发起">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <!-- 底部 Tab 主导航（≈22 个 App 共现：一级 ≤5、整格可点、落拇指热区） -->
    <nav class="tabbar" id="tabbar"></nav>
  </div>

  <!-- 底部弹层（向 Airbnb / Uber 学习：次级操作收进底部 Sheet，上圆角 20px，避免打断浏览） -->
  <div class="sheet-mask" id="sheetMask"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet__grip"></div>
    <div class="sheet__title" id="sheetTitle"></div>
    <div class="sheet__body" id="sheetBody"></div>
  </div>

  <!-- 全屏详情（向 Netflix / Spotify 学习：选中即展开画布） -->
  <div class="detail" id="detail">
    <button class="detail__back" id="detailBack" type="button" aria-label="返回">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="detail__scroll" id="detailContent"></div>
  </div>

  <script src="/m/data.js?v=6"></script>
  <script src="/m/app.js?v=6"></script>
</body>
</html>
