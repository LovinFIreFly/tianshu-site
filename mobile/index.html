<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0B0B0F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>甜薯剧本杀</title>
  <link rel="stylesheet" href="/m/styles.css?v=5">
  <script>
    window.__mobileErrors = [];
    function showErr(msg){ window.__mobileErrors.push(msg); var b=document.getElementById('jsError'); if(!b){b=document.createElement('div');b.id='jsError';b.style='position:fixed;inset:0;z-index:9999;background:#0B0B0F;color:#F0593F;padding:18px;white-space:pre-wrap;overflow:auto;font-size:13px;line-height:1.5';document.body.appendChild(b);} b.textContent+=msg+'\n---\n';}
    window.onerror=function(msg,url,line,col,err){ showErr((url||'')+':'+(line||0)+':'+(col||0)+' '+msg+'\n'+(err&&err.stack||'')); };
    window.addEventListener('error',function(e){ if(e.target && (e.target.tagName==='SCRIPT'||e.target.tagName==='LINK')) showErr('资源加载失败: '+(e.target.src||e.target.href||'')); });
  </script>
</head>
<body>
  <div id="app">
    <!-- 顶部毛玻璃导航（去色暗玻璃，色彩留给内容） -->
    <header class="topbar">
      <div class="topbar__row">
        <div class="brand-mark"><span class="dot"></span><span id="brandName">甜薯剧本杀</span></div>
        <label class="searchbox">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4-4"></path></svg>
          <input id="globalSearch" type="search" placeholder="搜本子 / 类型 / DM" inputmode="search">
        </label>
      </div>
    </header>

    <!-- 五个一级视图（底部 Tab ≤5） -->
    <main>
      <section class="view" id="view-home" data-view="home"></section>
      <section class="view" id="view-scripts" data-view="scripts"></section>
      <section class="view" id="view-car" data-view="car"></section>
      <section class="view" id="view-group" data-view="group"></section>
      <section class="view" id="view-me" data-view="me"></section>
    </main>

    <!-- 浮动主操作（底部 Tab 上方热区） -->
    <button class="fab" id="fab" aria-label="发起">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
    </button>

    <!-- 底部 Tab 主导航 -->
    <nav class="tabbar" id="tabbar">
      <button class="tab on" data-key="home"><span>首页</span></button>
      <button class="tab" data-key="scripts"><span>挑本</span></button>
      <button class="tab" data-key="car"><span>拼车</span></button>
      <button class="tab" data-key="group"><span>组局</span></button>
      <button class="tab" data-key="me"><span>我的</span></button>
    </nav>
  </div>

  <!-- 底部弹层 -->
  <div class="sheet-mask" id="sheetMask"></div>
  <div class="sheet" id="sheet">
    <div class="sheet__grip"></div>
    <div class="sheet__title" id="sheetTitle"></div>
    <div class="sheet__body" id="sheetBody"></div>
  </div>

  <!-- 全屏详情 -->
  <div class="detail" id="detail">
    <button class="detail__back" id="detailBack" aria-label="返回">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div id="detailContent"></div>
  </div>

  <script src="/m/data.js?v=5"></script>
  <script src="/m/app.js?v=5"></script>
</body>
</html>
