{% extends 'base.html' %}
{% block title %}注册 · {{ settings.shopName }}{% endblock %}
{% block body %}
<div class="panel" style="max-width:460px;margin:40px auto">
  <h1>注册</h1>
  <p class="sub">注册完就能约本、上车拼车</p>
  <form method="post" class="mt">
    <div class="field"><label>手机号</label>
      <input name="phone" inputmode="numeric" maxlength="11" required placeholder="11 位手机号"></div>
    <div class="field"><label>昵称</label>
      <input name="username" maxlength="16" required placeholder="怎么称呼你"></div>
    <div class="field"><label>密码</label>
      <input name="password" type="password" minlength="6" required placeholder="至少 6 位"></div>
    <div class="field"><label>邀请码（选填）</label>
      <input name="invite" placeholder="朋友的邀请码，双方各得一张券"></div>
    <button class="btn btn-accent btn-block" type="submit">注册并登录</button>
  </form>
  <p class="sub mt">已经有账号了？<a href="{{ url_for('user.login') }}" style="color:var(--primary2)">去登录 →</a></p>
</div>
{% endblock %}
