{% extends 'auth_base.html' %}
{% block title %}{{ settings.shopName }} · 欢迎{% endblock %}
{% block card %}
<div class="auth-card welcome-card">
  <div class="logo" aria-hidden="true">🍠</div>
  <h1>{{ settings.shopName }}</h1>
  <p class="slogan">沉浸式剧本体验 · 一场好戏，从甜薯开始</p>
  <div class="btns">
    <a class="btn btn-primary" href="{{ url_for('user.login') }}">登 录</a>
    <a class="btn" href="{{ url_for('public.home') }}">先逛逛</a>
  </div>
  <p class="sub" style="margin-top:26px">还没有账号？
    <a class="lnk" href="{{ url_for('user.register') }}">注册一下，新客有券 →</a></p>
</div>
{% endblock %}
