{% extends 'base.html' %}
{% block title %}{{ settings.shopName }} · 欢迎{% endblock %}
{% block body %}
{# 老版 page-welcome 的原样复刻：🍠 大 logo + 店名 + slogan + 按钮 #}
<div class="welcome">
  <div class="logo" aria-hidden="true">🍠</div>
  <h1>{{ settings.shopName }}</h1>
  <p class="slogan">沉浸式剧本体验 · 一场好戏，从甜薯开始</p>
  <div class="btns">
    <a class="btn btn-primary" href="{{ url_for('public.home') }}">进店看看</a>
    <a class="btn btn-accent" href="{{ url_for('user.login') }}">登 录</a>
  </div>
  <p class="sub" style="margin-top:26px">还没有账号？
    <a class="lnk" href="{{ url_for('user.register') }}">注册一下，新客有券 →</a></p>
</div>
{% endblock %}
