{# 剧本库的网格片段（SPA 换页只换这一段）。
   —— 被两处用：整页渲染（scripts.html include）、前端 fetch 换页（/scripts?partial=1）。
   契约（library.js 认这些）：
     · 根节点必须带 data-count，用来更新「N 本」
     · 卡片带 data-anim，换页时错峰入场
     · 不要在这里放 <script>，前端只做 innerHTML 替换
   需要变量：scripts（本页结果）、favs（我的收藏 id 集合）、rating（sid→评分） #}
<div class="ts-grid" data-count="{{ scripts|length }}">
  {% if scripts %}
  <div class="u-grid u-fold" data-fold>
    {% for s in scripts %}
    {% set _fav = s.id|string in favs %}
    <a class="u-card" data-fold-item data-anim
       href="{{ url_for('public.script_detail', sid=s.id) }}"
       data-cursor-label="看本">
      <span class="u-card__fig">
        {% if s.img %}<img src="{{ s.img }}" alt="{{ s.title }}" loading="lazy">
        {% else %}{% include '_script_ph.html' %}{% endif %}
      </span>
      <span class="u-card__cap">
        <span>
          <span class="u-card__t">
            {{ s.title or '未命名' }}
            {% if _fav %}<span class="u-tag u-tag--ink" style="margin-left:8px">想玩</span>{% endif %}
          </span>
          <span class="u-card__k">
            {{ s.type or '盒装' }}
            {% if s.players %} · {{ s.players }} 人{% endif %}
            {% if s.dur %} · {{ s.dur }}{% endif %}
            {% if rating.get(s.id|string) %} · {{ rating.get(s.id|string) }} 分{% endif %}
            {% if s.tags %} · {{ s.tags|join(' / ') }}{% endif %}
          </span>
        </span>
        <span class="u-card__a" aria-hidden="true">↘</span>
      </span>
    </a>
    {% endfor %}
  </div>
  {% else %}
  <div class="u-blank">
    <p class="u-blank__k">没找着</p>
    <p class="u-blank__d">换个词，或者把筛选清掉再看看。也可能这本刚被下架了。</p>
  </div>
  {% endif %}
</div>
