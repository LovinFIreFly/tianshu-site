{# 票根：nova 新版的签名物件。三个"戏票"漂浮在英雄区右侧，
   齿孔 + 票号 + 楷体竖排戏词 + 朱砂印章。纯装饰（aria-hidden），
   运动来自两处：[data-sway] 读 --mx/--my 的指针视差 + us-float 慢浮动。 #}
<div class="u-tickets" aria-hidden="true">
  <div class="u-tick u-tick--a" data-sway="lg">
    <span class="u-tick__no">NO. 1024</span>
    <span class="u-tick__w">今晚开演</span>
    <i class="u-tick__perf"></i>
    <span class="u-tick__row"><span>DOOR 20:00</span><span class="u-tick__seal">演</span></span>
  </div>
  <div class="u-tick u-tick--b" data-sway="md">
    <span class="u-tick__no">NO. 0517</span>
    <span class="u-tick__w">好戏开场</span>
    <i class="u-tick__perf"></i>
    <span class="u-tick__row"><span>SEAT A-07</span><span class="u-tick__seal">本</span></span>
  </div>
  <div class="u-tick u-tick--c" data-sway="sm">
    <span class="u-tick__no">NO. 0099</span>
    <span class="u-tick__w">玩完就退</span>
    <i class="u-tick__perf"></i>
    <span class="u-tick__row"><span>DEPOSIT ¥50</span><span class="u-tick__seal">座</span></span>
  </div>
</div>
