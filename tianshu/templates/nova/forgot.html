{% extends 'auth_base.html' %}
{% block title %}忘密码了？ · {{ settings.shopName }}{% endblock %}
{% block side_kick %}{{ settings.shopName }} · 忘密码了？{% endblock %}
{% block side_title %}想起来了？<br>那就登回来。{% endblock %}
{% block card %}
<div class="nv-authcard">
  <a href="{{ url_for('user.login') }}" style="font-size:13px;color:var(--nv-ink-2)">‹ 返回登记</a>
  <h2 class="nv-authcard__title" style="margin-top:var(--nv-s3)">忘密码了？</h2>
  <p class="nv-authcard__sub">用注册时填的邮箱收验证码，验证通过就能重设密码</p>

  <form method="post">
    <div class="nv-field">
      <label>注册手机号（用来找到你的账号）</label>
      <input name="phone" type="tel" maxlength="11" placeholder="11 位手机号" aria-label="手机号" required
             value="{{ request.form.get('phone','') }}">
    </div>
    <div class="nv-field">
      <label>注册邮箱（验证码发到这里）</label>
      <input name="email" type="email" placeholder="you@example.com" aria-label="邮箱" value="{{ request.form.get('email','') }}">
    </div>
    <div style="display:flex;gap:12px;align-items:flex-end">
      <div class="nv-field" style="flex:1">
        <label>验证码</label>
        <input name="code" type="tel" maxlength="6" placeholder="6 位验证码" aria-label="验证码" required>
      </div>
      <button class="nv-btn nv-btn--sm" type="button" data-code-btn data-purpose="reset"
              data-url="{{ url_for('user.code_send') }}" style="margin-bottom:var(--nv-s3);white-space:nowrap">获取验证码</button>
    </div>
    <p class="nv-code-tip" data-code-tip hidden></p>
    <input type="hidden" name="purpose" value="reset">

    <div class="nv-field">
      <label>新密码（至少 6 位）</label>
      <input name="password" type="password" placeholder="新密码" aria-label="新密码" autocomplete="new-password" required>
    </div>
    <div class="nv-field">
      <label>确认新密码</label>
      <input name="password2" type="password" placeholder="再输一遍" aria-label="确认新密码"
             autocomplete="new-password" enterkeyhint="go" required>
    </div>

    <button class="nv-btn nv-btn--accent nv-btn--block" type="submit">重设密码</button>
  </form>

  <div class="nv-authcard__links">
    <span style="font-size:13.5px;color:var(--nv-ink-3)">想起来了？</span>
    <a href="{{ url_for('user.login') }}">去登录 →</a>
  </div>
</div>
{% endblock %}
