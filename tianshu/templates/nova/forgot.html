{% extends 'auth_base.html' %}
{% block title %}忘密码了？ · {{ settings.shopName }}{% endblock %}
{% block side_kick %}{{ settings.shopName }} · 忘密码了？{% endblock %}
{% block side_title %}想起来了？<br><em>那就登回来</em>。{% endblock %}
{% block card %}
<a class="u-tlink" href="{{ url_for('user.login') }}" style="font-size:13px">‹ 返回登记</a>

<h2 class="au-card__t" style="margin-top:var(--us-s3)">忘密码了？</h2>
<p class="au-card__s">用注册时填的邮箱收验证码，验证通过就能重设密码。</p>

<form class="u-form" method="post">
  <div class="u-field">
    <label class="u-lab" for="fgPhone">注册手机号</label>
    <input class="u-in" id="fgPhone" name="phone" type="tel" maxlength="11" placeholder="11 位手机号"
           required value="{{ request.form.get('phone','') }}">
  </div>
  <div class="u-field">
    <label class="u-lab" for="fgMail">注册邮箱（验证码发到这里）</label>
    <input class="u-in" id="fgMail" name="email" type="email" placeholder="you@example.com"
           value="{{ request.form.get('email','') }}">
  </div>

  <div style="display:flex;gap:10px;align-items:flex-end">
    <div class="u-field" style="flex:1">
      <label class="u-lab" for="fgCode">验证码</label>
      <input class="u-in" id="fgCode" name="code" type="tel" maxlength="6" placeholder="6 位验证码" required>
    </div>
    <button class="u-pill u-pill--ghost" type="button" data-code-btn data-purpose="reset"
            data-url="{{ url_for('user.code_send') }}" style="padding:13px 18px;font-size:13.5px;white-space:nowrap">获取验证码</button>
  </div>
  <p class="u-code-tip" data-code-tip hidden></p>
  <input type="hidden" name="purpose" value="reset">

  <div class="u-field">
    <label class="u-lab" for="fgPwd">新密码（至少 6 位）</label>
    <input class="u-in" id="fgPwd" name="password" type="password" placeholder="新密码"
           autocomplete="new-password" required>
  </div>
  <div class="u-field">
    <label class="u-lab" for="fgPwd2">确认新密码</label>
    <input class="u-in" id="fgPwd2" name="password2" type="password" placeholder="再输一遍"
           autocomplete="new-password" enterkeyhint="go" required>
  </div>

  <button class="u-pill u-pill--ink u-pill--wide" type="submit" data-magnet="6">
    重设密码 <span class="u-pill__a" aria-hidden="true">↘</span>
  </button>
</form>

<p class="au-alt">
  <span>想起来了？</span>
  <a href="{{ url_for('user.login') }}" data-scribble>去登录 →</a>
</p>
{% endblock %}
