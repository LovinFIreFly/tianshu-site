{% extends 'layout.html' %}
{% block title %}{{ code }} · {{ settings.shopName }}{% endblock %}
{# NOVA 错误页：巨型编号 + 一句人话 + 出口。 #}
{% block body %}
<div class="nv-wrap">
  <section class="nv-errpage">
    <p class="nv-errpage__k">{{ 'Error' if code >= 500 else 'Not Found' }}</p>
    <h1 class="nv-errpage__no">{{ code }}</h1>
    <p class="nv-errpage__d">{{ msg }}</p>
    <div class="nv-errpage__act">
      <a class="nv-btn nv-btn--solid" href="{{ url_for('public.home') }}">回大厅</a>
      <a class="nv-btn" href="{{ url_for('public.scripts') }}">去挑本</a>
      <a class="nv-btn nv-btn--ghost" href="{{ url_for('public.faq') }}">先看看常见问题</a>
    </div>
  </section>
</div>
{% endblock %}
