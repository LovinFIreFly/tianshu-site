{% extends 'base.html' %}
{% block title %}找回密码 · {{ settings.shopName }}{% endblock %}
{% block body %}
{# 老版 page-forgot 的原样复刻 #}
<div class="auth-page">
  <div class="login-card">
    <a class="back" href="{{ url_for('user.login') }}">‹ 返回登录</a>
    <h2>找回密码</h2>
    <p class="sub">验证手机号后即可重置密码</p>

    <form method="post">
      <div class="field"><span class="ico" aria-hidden="true">📱</span>
        <input name="phone" type="tel" maxlength="11" placeholder="注册手机号" aria-label="手机号" required
               value="{{ request.form.get('phone','') }}"></div>
      <div class="field"><span class="ico" aria-hidden="true">📧</span>
        <input name="email" type="email" placeholder="邮箱（用于接收验证码）" aria-label="邮箱"
               value="{{ request.form.get('email','') }}"></div>

      <div class="code-row">
        <div class="field"><span class="ico" aria-hidden="true">🔑</span>
          <input name="code" type="tel" maxlength="6" placeholder="验证码" aria-label="验证码" required></div>
        <button class="btn-code" type="submit" formaction="{{ url_for('user.code_send') }}" formmethod="post"
                onclick="this.form.purpose.value='reset'">获取验证码</button>
      </div>
      <input type="hidden" name="purpose" value="reset">
      <p class="hint-dev" style="text-align:left">本地版：验证码打印在运行服务的黑窗口里，也可以直接填 1234</p>

      <div class="field"><span class="ico" aria-hidden="true">🔒</span>
        <input name="password" type="password" placeholder="新密码（至少 6 位）" aria-label="新密码"
               autocomplete="new-password" required></div>
      <div class="field"><span class="ico" aria-hidden="true">🔒</span>
        <input name="password2" type="password" placeholder="确认新密码" aria-label="确认新密码"
               autocomplete="new-password" enterkeyhint="go" required></div>

      <button class="btn btn-accent" type="submit">重置密码</button>
    </form>

    <p class="foot-line">想起来了？<a class="lnk" href="{{ url_for('user.login') }}">去登录 →</a></p>
  </div>
</div>
{% endblock %}
