{% extends 'base.html' %}
{% block title %}找回密码 · {{ settings.shopName }}{% endblock %}
{% block body %}
<div class="panel" style="max-width:430px;margin:40px auto">
  <h1>找回密码</h1>
  <p class="sub">用注册时的手机号验证一下，就能重设</p>

  <form method="post" class="mt">
    <div class="field"><label>注册手机号</label>
      <input name="phone" inputmode="numeric" maxlength="11" required placeholder="11 位手机号"></div>
    <div class="field"><label>验证码</label>
      <div class="row" style="gap:8px">
        <input name="code" inputmode="numeric" maxlength="6" placeholder="6 位验证码">
        <button class="btn btn-sm" type="submit" formaction="{{ url_for('user.code_send') }}"
                formmethod="post" onclick="this.form.phone.value=this.form.phone.value">要验证码</button>
      </div></div>
    <div class="field"><label>新密码</label>
      <input name="password" type="password" minlength="6" required placeholder="至少 6 位"></div>
    <button class="btn btn-accent btn-block" type="submit">重设密码</button>
  </form>

  <p class="sub mt">本地版说明：验证码会打印在运行服务的那个黑窗口里；嫌麻烦可以直接填 <b>1234</b>。</p>
  <p class="sub">想起来了？<a href="{{ url_for('user.login') }}" style="color:var(--primary2)">去登录 →</a></p>
</div>
{% endblock %}
