{% extends 'auth_base.html' %}
{% block title %}忘密码了？ · {{ settings.shopName }}{% endblock %}
{% block card %}
<div class="v3auth__card">
  <div class="v3auth__brand"><span class="logo">🍠</span><span>{{ settings.shopName }} · 忘密码了？</span></div>
  <a class="back" href="{{ url_for('user.login') }}">‹ 返回登记</a>
  <h2>忘密码了？</h2>
  <p class="sub">用注册时填的邮箱收验证码，验证通过就能重设密码</p>

  <form method="post">
    <div class="field">
      <label>注册手机号（用来找到你的账号）</label>
      <input name="phone" type="tel" maxlength="11" placeholder="11 位手机号" aria-label="手机号" required
             value="{{ request.form.get('phone','') }}">
    </div>
    <div class="field">
      <label>注册邮箱（验证码发到这里）</label>
      <input name="email" type="email" placeholder="you@example.com" aria-label="邮箱"
             value="{{ request.form.get('email','') }}">
    </div>

    <div class="code-row">
      <div class="field">
        <label>验证码</label>
        <input name="code" type="tel" maxlength="6" placeholder="6 位验证码" aria-label="验证码" required>
      </div>
      {# type=button（不是 submit）：点它只发验证码，不该触发整表校验 —— 见 auth_base.html 里的脚本 #}
      <button class="btn-code" type="button" data-code-btn data-purpose="reset"
              data-url="{{ url_for('user.code_send') }}">获取验证码</button>
    </div>
    <p class="code-tip" data-code-tip hidden></p>
    <input type="hidden" name="purpose" value="reset">

    <div class="form-grid">
      <div class="field">
        <label>新密码（至少 6 位）</label>
        <input name="password" type="password" placeholder="新密码" aria-label="新密码"
               autocomplete="new-password" required>
      </div>
      <div class="field">
        <label>确认新密码</label>
        <input name="password2" type="password" placeholder="再输一遍" aria-label="确认新密码"
               autocomplete="new-password" enterkeyhint="go" required>
      </div>
    </div>

    <button class="b3 b3--accent b3--wide" type="submit">重设密码</button>
  </form>

  <p class="foot-line">想起来了？<a class="lnk" href="{{ url_for('user.login') }}">去登录 →</a></p>
</div>
{% endblock %}
