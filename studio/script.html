<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本子详情 · 天枢 STUDIO</title>
<meta name="description" content="天枢剧本杀 STUDIO 版式 · 本子详情。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/studio.css">
</head>
<body>

<div class="grain" aria-hidden="true"></div>
<div class="cursor-dot" id="curDot" aria-hidden="true"></div>
<div class="cursor-ring" id="curRing" aria-hidden="true"></div>

<header class="nav" id="nav">
  <a class="nav__logo" href="/studio/">天枢<span>·</span>STUDIO</a>
  <nav class="nav__links" id="navLinks">
    <a href="/studio/">首页</a>
    <a href="/studio/scripts" class="is-cur">本子</a>
    <a href="/studio/car">拼车</a>
    <a href="mailto:hello@tianshu.example">联系</a>
  </nav>
  <button class="nav__burger" id="burger" aria-label="菜单"><span></span><span></span></button>
</header>

<main class="sub">
  <section class="detail">
    <div class="wrap" id="detail"><!-- JS 注入 --></div>
  </section>

  <!-- ══ 约场下单（第四章表单页规范：大标题占半屏、左对齐、底部边框输入框、橙色 focus、胶囊提交）══ -->
  <section class="book" id="book">
    <div class="wrap book__wrap">
      <p class="kick" data-reveal>约一场 / Book a seat</p>
      <h2 class="h2" data-reveal>把这局<em>定下来</em></h2>
      <p class="lead" data-reveal>留个称呼和手机号，选好日子我们小客服就跟你确认。定金锁位、玩完原路退回——在四代里一步搞定，不用跳回老站。</p>

      <form class="book__form" id="bookForm" data-reveal>
        <div class="book__row">
          <label class="field">
            <span>称呼</span>
            <input name="name" type="text" placeholder="怎么称呼你" required>
          </label>
          <label class="field">
            <span>手机号</span>
            <input name="phone" type="tel" placeholder="11 位手机号" required>
          </label>
        </div>
        <div class="book__row">
          <label class="field">
            <span>日期</span>
            <input name="day" type="text" placeholder="如 本周六 / 10-18">
          </label>
          <label class="field">
            <span>时间</span>
            <input name="time" type="text" placeholder="如 19:30">
          </label>
          <label class="field field--sm">
            <span>人数</span>
            <input name="players" type="text" placeholder="几人局">
          </label>
        </div>
        <div class="book__row">
          <label class="field">
            <span>想跟的 DM</span>
            <select name="dm" id="dmSelect">
              <option value="">不挑，听安排</option>
            </select>
          </label>
        </div>
        <label class="field">
          <span>备注</span>
          <textarea name="note" rows="2" placeholder="特殊需求、忌口、小秘密…"></textarea>
        </label>
        <button class="pill book__submit" type="submit">提交约场 →</button>
        <p class="book__ok" id="bookOk" hidden></p>
      </form>
    </div>
  </section>
</main>

<footer class="foot">
  <span>© 2026 天枢剧本杀 · STUDIO 版式</span>
  <span><a href="/studio/scripts">返回本子库</a></span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="js/studio.js" defer></script>
<script src="js/studio-pages.js" defer></script>
</body>
</html>
