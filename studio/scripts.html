<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本子库 · 天枢 STUDIO</title>
<meta name="description" content="天枢剧本杀 STUDIO 版式 · 在售本子全收录。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/studio.css">
</head>
<body>

<!-- ══ 胶片颗粒 + 自定义光标（与首页同源）══ -->
<div class="grain" aria-hidden="true"></div>
<div class="cursor-dot" id="curDot" aria-hidden="true"></div>
<div class="cursor-ring" id="curRing" aria-hidden="true"></div>

<!-- ══ 导航 ══ -->
<header class="nav" id="nav">
  <a class="nav__logo" href="/studio/">天枢<span>·</span>STUDIO</a>
  <nav class="nav__links" id="navLinks">
    <a href="/studio/">首页</a>
    <a href="/studio/scripts" class="is-cur">本子</a>
    <a href="/studio/car">拼车</a>
    <a href="mailto:hello@tianshu.example">联系</a>
  </nav>
  <button class="nav__burger" id="burger" aria-label="菜单"><span></span><span></span></button>
</header>

<main class="sub">
  <!-- ══ 头部 ══ -->
  <section class="sub-hero">
    <div class="wrap">
      <p class="kick" data-reveal>本子库 / Scripts</p>
      <h1 class="h2" data-reveal>挑今天这局戏</h1>
      <p class="lead" data-reveal>在售本子都在这儿。点筛选挑口味，点卡片进详情——看中这局，进详情就能约场、去拼车大厅就能占座，全程在四代里完成。</p>

      <div class="sub-tools" data-reveal>
        <input id="q" class="sub-search" type="search" placeholder="搜本子名…" autocomplete="off">
        <div class="filter" id="typeFilter">
          <button class="is-on" data-t="all">全部</button>
        </div>
        <div class="filter" id="diffFilter">
          <button class="is-on" data-d="all">全难度</button>
          <button data-d="1">★</button>
          <button data-d="2">★★</button>
          <button data-d="3">★★★</button>
          <button data-d="4">★★★★</button>
          <button data-d="5">★★★★★</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ══ 列表 ══ -->
  <section class="sub-list">
    <div class="wrap">
      <div class="grid" id="scriptGrid"><!-- JS 注入 --></div>
      <p id="empty" class="empty" hidden>没有匹配的本子，换个筛选试试。</p>
    </div>
  </section>
</main>

<footer class="foot">
  <span>© 2026 天枢剧本杀 · STUDIO 版式</span>
  <span><a href="/studio/">返回首页</a></span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="js/studio.js" defer></script>
<script src="js/studio-pages.js" defer></script>
</body>
</html>
